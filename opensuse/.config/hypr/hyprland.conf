#####################
### LOOK AND FEEL ###
#####################
# Refer to https://wiki.hyprland.org/Configuring/Variables/
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 3
    no_border_on_floating = false
    border_size = 0
    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false
    # extend_border_grab_area = 15
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    # dwindle or master
    layout = dwindle

    # SNAP 
    snap {
        enabled = true
        window_gap = 10
        #monitor_gap = 10 
        border_overlap = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    # 2.0 is a circle and 4.0 is a squircircle [2.0, 10.0]
    rounding_power = 4.0 
    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = true  
    dim_strength = 0.1 
    dim_special = 0.2 
    shadow {
        enabled = true
        range = 4
        render_power = 3
        sharp = false 
        ignore_window = true 
        color = 0xee1a1a1a
    #drop_shadow = true
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
    }
    blur {
        enabled = false
        size = 3
        passes = 1
        ignore_opacity = true
        new_optimizations = true
        vibrancy = 0.1696
        contrast = 0.8916
        brightness = 0.8172
        popups = false 
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0  # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = yes # If true disables the random hyprland logo / anime girl background. :(
    disable_hyprland_qtutils_check = true
    disable_splash_rendering = false
    disable_autoreload = false
    font_family = JetBrainsMono Nerd Font
    focus_on_activate = false 
    mouse_move_focuses_monitor = true
    middle_click_paste = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    mouse_refocus = true
    focus_on_close = 0

    numlock_by_default = false 

    repeat_rate = 25 
    repeat_delay = 600 

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.


    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true 
        scroll_factor = 1.0
    }
    touchdevice {
        output = 
        enabled = false 
      }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

binds {
    workspace_back_and_forth = false 
    allow_workspace_cycles = false 
    workspace_center_on = 0
}

cursor {
    inactive_timeout = 1.0
    enable_hyprcursor = true
}

####################
### KEYBINDINGSS ###
####################
# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$terminal = alacritty
$fileManager = dolphin
$menu = wofi -show drun
# Lockscreen
$lockscreen = ~/.config/hypr/scripts/lockscreen
#$wlogout = ~/.config/hypr/scripts/wlogout
# Fuzzel
#bind = $mainMod, SPACE, exec, fuzzel
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
# Kill active window 
bind = $mainMod, Q, killactive,
#bind = $mainMod, Q, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating, 
bind = $mainMod SHIFT, T, workspaceopt, allfloat # Toggle all windows into floating mode
# bind = $mainMod, D, exec, fuzzel
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
#bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, D, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window
#bind = $mainMod, L, exec, $menu
#bind = $mainMod, D, exec, fuzzel
# bind= $mainMod, O , exec, $wlogout
bind= $mainMod, L, exec, $lockscreen
bind = $mainMod SHIFT, R, exec, hyprctl reload config-only
#bind = $mainMod, L, exec, wlogout --protocol layer-shell -b 5 -T 400 -B 400
#bind = $mainMod CTRL, R, exec, "$HOME/.config/hypr/scripts/reload.sh"
# Power menu
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/powermenu
bind = $mainMod, ESCAPE, exec, "$HOME/.config/hypr/scripts/powermenu"
bind = $mainMod SHIFT, B, exec, "$HOME/.config/rofi/rofi-bluetooth.sh"
bind = $mainMod SHIFT, X, exec, "$HOME/.config/rofi/rofi-wifi.sh"
bind = $mainMod SHIFT, V, exec, "$HOME/.config/rofi/rofi-clipboard.sh"
bind = $mainMod SHIFT, Z, exec, "$HOME/.config/rofi/rofi-calc.sh"
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/launch.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

 # Cycle windows if floating bring to top
# bind = ALT, tab, cyclenext
# bind = ALT, tab, bringactivetotop

# Workspaces related
bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot

# Take a screenshot of the focused output and save it into screenshots
bind = $mainMod, S, exec, ~/.config/hypr/scripts/screenshot.sh
# Take a screenshot of the selected region
bind = $mainMod, X, exec, ~/.config/hypr/scripts/screenshot.sh selected-region
# Take a screenshot and save it to the clipboard
bind = $mainMod CONTROL, S, exec, ~/.config/hypr/scripts/screenshot.sh save-to-region
# Take a screenshot of the selected windows
bind = $mainMod CONTROL, P, exec, ~/.config/hypr/scripts/screenshot.sh focused-window

# Fn Keys 
#bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Increase brightness by 10%
#bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Reduce brightness by 10%
#bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
#bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


bind =   , XF86MonBrightnessDown, exec, brightnessctl set 5%- && brightnessctl get > ~/.wob.sock
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5% && brightnessctl get > ~/.wob.sock
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% && pamixer --get-volume > ~/.wob.sock
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% && pamixer --get-volume > ~/.wob.sock

# Requires playerctl
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# Sway notifications
# Toggle control center
bind =  $mainMod SHIFT,n, exec, swaync-client -t -sw


# Special 
#bind = SUPER SHIFT, Y, exec, togglespecialworkspace
#bind = SUPER, C, movetoworkspace, special
