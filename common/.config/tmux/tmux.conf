# ==========================
# ===  General settings  ===
# ==========================
# To see all options: tmux show -g
# To see server options: tmux show -s
# To see global window options: tmux show -wg
# To see a specific option: tmux show -g <option>
# To set or unset options: set-option or set
# To set global options: set -g status off
# To set server options: set -s <option> <value>
# -w and -s options are not mandatory.
# To unset an option: set -gu option
# To format strings: #{}
# To embed shell commands #(). Example '#(uptime)'
# Colors and styles: status-style or #[]


############
# Options  #
############
# Server Options
set -g buffer-limit 100
set -g default-terminal "${TERM}"
set -g escape-time 0
set -g editor '#(nvim)'
set -g exit-empty on
set -g exit-unattached on
set -s extended-keys on
set -g focus-events on
set -g set-clipboard on
set -as terminal-features 'xterm*:extkeys:RGB'
set -ga terminal-overrides ',xterm-256color:Tc'
# set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'


# Session
set -g activity-action any
set -g base-index 1
set -g bell-action none
set -g default-shell /usr/bin/zsh
set -g destroy-unattached on
set -g detach-on-destroy on
set -g display-panes-active-colour "#8FBCBB"
set -g display-panes-colour "#8FBCBB"
set -g display-time 1000
set -g history-limit 20000
# set -g message-line 0
# set -g message-style 'fg=white,bg=green'
set -g mouse on
set -g renumber-windows on
set -g repeat-time 300
# set -g set-titles off
# set -g set-titles-string "#I:#W"
set -g status on
set -g status-interval 3
set -g status-justify left
set -g status-keys vi
set -g status-left ''
set -g status-left-length 20
set -g status-position top
# set -g status-right
set -g status-right-length 100
#set -g status-style bg=black,fg=yellow,dim
#set -g status-right '#{?client_prefix,#[fg=white]#[bg=red]#[bold] - PREFIX - ,#[fg=brightwhite]#H}'
# For Yazi image previews to work in tmux
set -ga update-environment TERM
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# Window
set -g aggressive-resize on
set -g automatic-rename off
# set -g automatic-rename-format FORMAT
set -g clock-mode-colour "#ECEFF4"
set -g clock-mode-style 12
set -g mode-keys vi
# set -g mode-style bg=green,fg=black
set -g monitor-activity off
set -g monitor-bell off
set -g pane-active-border-style ''
set -g pane-base-index 1
set -g pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-status off
# set -g pane-border-style 'fg=brightblack,bg=default'
# set -g window-status-format " #F#I:#W#F "
# set -g window-status-current-format " #F#I:#W#F "
# set -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=white] #W "
# set -g window-status-current-format "#[bg=brightmagenta]#[fg=white] #I #[fg=white]#[bg=cyan] #W "
# set -g window-status-current-style bg=black,fg=yellow,dim
# set -g window-status-style bg=green,fg=black,reverse
set -g window-status-separator " | "
set -g wrap-search on

# PANE
set -g allow-passthrough on
set -g allow-rename on
set -g allow-set-title on
set -g remain-on-exit off
set -g synchronize-panes off


###############
# Keybindings #
###############
# To change keybindings use `bind-key` and `unbind-key`
# Remove all keybindings
#unbind-key -a
# Changge prefix from C-b to C-Space
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# Reload tmux.conf
bind r source-file ~/.config/tmux/tmux.conf\; display "Tmux Config Reloaded!"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Split window
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind n new-window -c "#{pane_current_path}"
bind x kill-pane
bind q kill-window

# Resize Pane
bind + resize-pane -Z

# Basics
bind d detach
bind '"' choose-window
bind : command-prompt
bind ? list-keys

# Resize Pane
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

# Rename windows and sessions
bind z  command-prompt -I "#{window_name}" "rename-window '%%'"
bind Z command-prompt -I "#{session_name}" "rename-session '%%'"

bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

