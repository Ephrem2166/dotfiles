# ==========================
# ===  General settings  ===
# ==========================
# To see all options: tmux show -g
# To see server options: tmux show -s
# To see global window options: tmux show -wg
# To see a specific option: tmux show -g <option>
# To set or unset options: set-option or set
# To set global options: set -g status off
# To set server options: set -s <option> <value>
# -w and -s options are not mandatory.
# To unset an option: set -gu option
# To format strings: #{}
# To embed shell commands #(). Example '#(uptime)'
# Colors and styles: status-style or #[]
# Keybindings live in a separate file. -q = no error if missing.
source-file -q "$HOME/.config/tmux/binds.conf"


############
# Options  #
############
# Server Options
set -s buffer-limit 100
set -s message-limit 10000
# set -s default-terminal "xterm-256color"
set -s default-terminal "tmux-256color" # Check `infocmp tmux-256color`
set -s escape-time 0
set -s editor nvim
set -s exit-empty on
set -s exit-unattached on
set -s extended-keys on
set -s focus-events on
set -s set-clipboard on
set -s copy-command wl-copy # Install `wl-clipboard`


# set -as terminal-features 'xterm*:extkeys:RGB'
# set -as terminal-features 'tmux-256color:RGB'
# set -ga terminal-overrides ',xterm-256color:Tc'
# set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
# set -as terminal-features 'xterm*:clipboard:title:RGB:strikethrough:usstyle'
# set -as terminal-features ',xterm-kitty:clipboard'
# set -as terminal-features 'alacritty*:hyperlinks'
# set -as terminal-features 'wezterm*:hyperlinks'

set -su terminal-features
set -gu update-environment
set -as terminal-features 'xterm-kitty:clipboard:hyperlinks:RGB:strikethrough:usstyle:extkeys'
# update-environment is an ARRAY: one variable per line (a space-separated string won't work).
# Keeps panes in sync with the current kitty window / compositor after re-attaching.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KITTY_PID
set -ga update-environment WAYLAND_DISPLAY
set -ga update-environment SWAYSOCK
set -ga update-environment NIRI_SOCKET



set-window-option -g xterm-keys on

# Session
# Sessions survive closing kitty / detaching (pairs with kitty.conf `shell tmux new-session -A -s main`)
set -g destroy-unattached off
set -s exit-unattached off

set -g activity-action any
set -g base-index 1
set -g bell-action none
set -g default-shell "${SHELL}"
set -g detach-on-destroy on
set -g display-panes-active-colour "#8FBCBB"
set -g display-panes-colour default
set -g display-time 1000
set -g history-limit 50000
# set -g message-line 0
set -g message-style 'fg=#D8DEE9 bold,bg=#2E3440'

set -g mouse on
set -g renumber-windows on
set -g repeat-time 300
set -g set-titles on
# set -g set-titles-string "#{pane_title}"
set -g set-titles-string "#W"

# Status line
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-keys vi
set -g status-left "#{session_name} "
set -g status-left-length 20
set -g status-position top
# set -g status-right "%b %d-%m-%Y | %I:%M %p |"
# set -g status-right "| #{window_name} | %b %d-%m-%Y | %I:%M %p |"
# set -g status-right "%Y-%m-%d | %I:%M %p |"
set -g status-right "#[fg=#88C0D0]#H #[fg=default]| %Y-%m-%d | %I:%M %p "
set -g status-right-length 100
 set -g status-style "bg=#242933,fg=#D8DEE9,bold"
#set -g status-style bg=black,fg=yellow,dim
#set -g status-right '#{?client_prefix,#[fg=white]#[bg=red]#[bold] - PREFIX - ,#[fg=brightwhite]#H}'
# For Yazi image previews to work in tmux
set -g word-separators " =+!@#$%^&*,.<>/?;:\\|~`(){}[]\"'"
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# Window
set -g aggressive-resize on
set -g automatic-rename on
# set -g automatic-rename-format FORMAT
# setw -g automatic-rename-format "#{pane_current_command}"
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}"
set -g clock-mode-colour "#ECEFF4"
set -g clock-mode-style 12
set -g mode-keys vi
# set -g mode-style bg=green,fg=black
# setw -g mode-style "bg=#434C5E,fg=#D8DEE9,bold"
set -g mode-style "bg=#4C4C5E,fg=#ECEFF4"
# set -g pane-active-border-style "fg=cyan,bg=default"
set -g monitor-activity off
set -g monitor-bell off
set -g monitor-silence 0
set -g pane-active-border-style 'fg=#4C566A'
set -g pane-base-index 1
set -g pane-border-indicators off
set -g pane-border-lines heavy
set -g pane-border-status off
set -g pane-border-style 'fg=brightblack,bg=default'
# set -g window-status-format " #F#I:#W#F "
set -g window-status-current-format " #F#I:#W#F "
set -g window-status-format "#[fg=#ECEFF4]#[bg=#434C5E] #I #[bg=#434C5E]#[fg=#ECEFF4] #W "
set -g window-status-current-format "#[bg=#2E3440]#[fg=#D8DEE9 bold] #I #[fg=#D8DEE9]#[bg=#2E3440] #W "
set -g window-status-current-style bg=#D8DEE9,fg=#2E3440
set -g window-status-style bg=#ECEFF4,fg=#434C5E,dim
set -g window-status-separator " | "
set -g wrap-search on

# PANE
set -g allow-passthrough on
set -g allow-rename on
set -g allow-set-title on
set -g remain-on-exit off
set -g synchronize-panes off

# OTHERS


############
# Plugins ##
############
# Plugins (TPM)  install: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# then prefix + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'laktak/extrakto'
# set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @resurrect-save 'M-s' # `C-s` conflicts with session switcher
set -g @extrakto_key 'e'


set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
set-environment -g TMUX_FZF_LAUNCH_KEY C-f

set -g @resurrect-capture-pane-contents 'on'    # restore scrollback, not just layout
set -g @resurrect-strategy-nvim 'session'       # restore nvim sessions cleanly
set -g @resurrect-processes 'ssh vim nvim man less'  # which programs to restore


# # Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run '$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm'
run '$HOME/.config/tmux/plugins/tpm/tpm'
