###############
# Keybindings #
###############
# To change keybindings use `bind-key` and `unbind-key`
# Remove all keybindings
#unbind-key -a
# Changge prefix from C-b to C-Space
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# Reload tmux.conf
bind r source-file ~/.config/tmux/tmux.conf\; display "Tmux Config Reloaded!"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Split window
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind n new-window -c "#{pane_current_path}"
bind x kill-pane
bind q kill-window

# Resize Pane
bind + resize-pane -Z

# Basics
bind d detach
bind w choose-window
bind : command-prompt
bind ? list-keys

# Resize Pane
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

# Rename windows and sessions
bind z  command-prompt -I "#{window_name}" "rename-window '%%'"
bind Z command-prompt -I "#{session_name}" "rename-session '%%'"

bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9


# Swap current pane with the next pane
bind = swap-pane -D

# Swap current window with the next one
bind C-n swap-window -t +1
# Swap current window with the previous one
bind C-p swap-window -t -1


# Switch between modes
bind-key -n M-1 select-layout even-horizontal
bind-key -n M-2 select-layout even-vertical
bind-key -n M-3 select-layout main-horizontal
bind-key -n M-4 select-layout main-vertical
bind-key -n M-5 select-layout tiled

# Move to another window
bind-key W command-prompt -p "Session name to move to:" "move-window -t '%%'"

# Copy Mode
bind-key / copy-mode
