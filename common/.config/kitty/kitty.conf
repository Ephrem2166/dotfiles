# Kitty config
# Author: Ephrem G.
# ---

####################
# Advanced
####################
shell /usr/bin/zsh
editor .
close_on_child_death yes
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size 512
allow_hyperlinks yes
shell_integration no-cursor
notify_on_cmd_finish never
wayland_titlebar_color system

####################
# General
####################
copy_on_select yes
enable_audio_bell no
disable_ligatures never
confirm_os_window_close 0
force_ltr yes
mouse_hide_wait 1.0

####################
# Window
####################
window_margin_width 0
window_padding_width 0
hide_window_decorations no
placement_strategy top-left
draw_minimal_borders yes
background_opacity 1.0
#macos_option_as_alt yes
#macos_quit_when_last_window_closed yes
#macos_show_window_title_in window
remember_window_size  yes
initial_window_width  640
initial_window_height 400

window_border_width 1.0

enabled_layouts *
window_resize_step_cells 2
window_resize_step_lines 2

single_window_margin_width -1000.0
placement_strategy center

####################
# Font
####################
# Examples:
#   Select by family only, actual face selection is automatic
#   $ font_family family="Fira Code"
#   Select an exact face by Postscript name
#   $ font_family postscript_name=FiraCode
#   Select an exact face by family with features and variable weight
#   $ font_family family=SourceCodeVF variable_name=SourceCodeUpright features="+zero cv01=2" wght=380
#font_family  family="JetBrainsMono Nerd Font"
# font_family  family="FiraCode Nerd Font"
# font_family  family="Iosevka Nerd Font Propo"
# font_family  family="Fantasque Sans Mono"
font_family  family="Berkeley Nerd Font"
font_size        11.0
bold_font        auto
italic_font      auto
bold_italic_font auto

adjust_line_height  1
adjust_column_width 0

disable_ligatures always
# symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols
# symbol_map codepoints Font Family Name

# narrow_symbols codepoints [optionally the number of cells]
# narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

# TODO: ?
# narrow_symbols U+E200-U+F8F0,U+F0000-U+F1AF0 2

####################
# CURSOR
####################
cursor #D8DEE9
cursor_text_color #D8DEE9
cursor_shape block
cursor_shape_unfocused block
cursor_beam_thickness 5.0
cursor_underline_thickness 2.0
cursor_blink_interval -1
cursor_stop_blinking_after 10.0

####################
# SCROLLBACK
####################
scrollback_lines 2000
scrollback_indicator_opacity 1.0

####################
# THEMES
####################
include themes/my-nord.toml
# include themes/github_light.conf
# include themes/nord.conf

####################
# MOUSE
####################
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
show_hyperlink_targets no
underline_hyperlinks hover
copy_on_select clipboard
paste_actions quote-urls-at-prompt,confirm
strip_trailing_spaces always
focus_follows_mouse no

####################
##### Performance
####################
# repaint_delay 10
# input_delay 3
# sync_to_monitor yes

####################
##### Terminal Bell
####################
enable_audio_bell no
visual_bell_duration 0.0
visual_bell_color none
window_alert_on_bell yes
bell_on_tab "🔔 "

####################
#### TAB BAR #######
####################
tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style fade
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_separator " ┇"
tab_powerline_style angled
tab_activity_symbol none
tab_title_max_length 0
active_tab_title_template none
active_tab_foreground   #000
active_tab_background   #eee
active_tab_font_style   bold-italic
inactive_tab_foreground #444
inactive_tab_background #999
inactive_tab_font_style normal
tab_bar_background none
tab_bar_margin_color none

# TMux
startup_session tmux_launch.conf

####################
# KEY MAPPINGS
####################
# Copy and Paste From Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

####################
# SCROLLING
####################
map ctrl+shift+up scroll_line_up
map ctrl+shift+k scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+j scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

####################
##### Window #######
####################
map ctrl+shift+enter new_window
map ctrl+shift+q close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+r start_resizing_window
map ctrl+shift+f8 swap_with_window

####################
### Tab
####################
map ctrl+shift+right next_tab
map ctrl+tab next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+t new_tab
map ctrl+shift+d close_tab
map ctrl+t new_tab


####################
#### Font Sizes ####
####################
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+kp_add change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+kp_subtract change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
