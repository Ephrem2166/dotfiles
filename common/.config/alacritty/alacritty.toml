[general]
import = ["~/dotfiles/common/.config/alacritty/nord.toml"]
live_config_reload = true

[terminal]
# shell.program = "/usr/bin/fish"
shell.program = "/bin/zsh"
[colors]
draw_bold_text_with_bright_colors = true

[font]
#normal = { family = "FantasqueSansM Nerd Font", style = "Regular" }
#bold = { family = "FantasqueSansM Nerd Font", style = "Bold" }
#italic = { family = "FantasqueSansM Nerd Font", style = "Italic" }
#bold_italic = { family = "FantasqueSansM Nerd Font", style = "Bold Italic" }

# JetBrainsMono
#normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
#bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
#italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
#bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

#JuliaMono
#normal = { family = "JuliaMono", style = "Regular" }
#bold = { family = "JuliaMono", style = "Bold" }
#italic = { family = "JuliaMono", style = "Italic" }
#bold_italic = { family = "JuliaMono", style = "Bold Italic" }


#normal = { family = "Iosevka Nerd Font Mono", style = "Regular" }
#bold = { family = "Iosevka Nerd Font Mono", style = "Bold" }
#italic = { family = "Iosevka Nerd Font Mono", style = "Italic" }
#bold_italic = { family = "Iosevka Nerd Font Mono", style = "Bold Italic" }

# Ubuntu Mono
#normal = { family = "UbuntuMono Nerd Font", style = "Regular" }
#bold = { family = "UbuntuMono Nerd Font", style = "Bold" }
#italic = { family = "UbuntuMono Nerd Font", style = "Italic" }
#bold_italic = { family = "UbuntuMono Nerd Font", style = "Bold Italic" }

# Space Mono
#normal = { family = "SpaceMono Nerd Font", style = "Regular" }
#bold = { family = "SpaceMono Nerd Font", style = "Bold" }
#italic = { family = "SpaceMono Nerd Font", style = "Italic" }
#bold_italic = { family = "SpaceMono Nerd Font", style = "Bold Italic" }

# PragmataPro Mono
#normal = { family = "PragmataProMono Nerd Font", style = "Regular" }
#bold = { family = "PragmataProMono Nerd Font", style = "Bold" }
#italic = { family = "PragmataProMono Nerd Font", style = "Italic" }
#bold_italic = { family = "PragmataProMono Nerd Font", style = "Bold Italic" }

# Berkeley Mono
normal = { family = "Berkeley Nerd Font", style = "Regular" }
bold = { family = "Berkeley Nerd Font", style = "Bold" }
italic = { family = "Berkeley Nerd Font", style = "Italic" }
bold_italic = { family = "Berkeley Nerd Font", style = "Bold Italic" }


size = 11.0

# Letter Spacing and Line Spacing
offset = { x = 0, y = 1 }

[bell]
animation = "Ease"
duration = 300
color = "#d8dee9"

[cursor]
style = { shape = "Beam", blinking = "Always" }
unfocused_hollow = false
blink_interval = 500
blink_timeout = 30
thickness = 0.15
[mouse]
hide_when_typing = true
bindings = [{ mouse = "Middle", action = "Paste" }]

[selection]
save_to_clipboard = true

[scrolling]
multiplier = 4

[window]
opacity = 1.0
decorations = 'Full'
title = 'Alacritty'
dynamic_title = true
padding = { x = 10, y = 10 }
dynamic_padding = true
#startup_mode = "Maximized"

[env]
TERM = "xterm-256color"
