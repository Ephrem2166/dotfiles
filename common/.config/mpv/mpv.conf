####################################################################################
# # MPV Configuration                                                              #
# # Ephrem G.                                                                      #
####################################################################################
# To see default values: `mpv --list-options`
# Configuration settings and command line options are similar
# Command line options are preceded by `--`
# To include configuration files `include=/path/to/file`
#############
# # Profile #
#############
# profile=default
#Profile which sets some quality settings (Recommended)
profile=high-quality
#Profile for really bad hardware
#profile=fast
# scale=ewa_lanczossharp
# cscale=ewa_lanczossharp
#video-sync=display-resample
#video-aspect-override=-1
#video-output-levels=auto
# Support of hardware acceleration
# hwdec=vaapi
# hwdec-codecs=all
# hwdec=no # For software (Default)
# By default X is used, force wayland
#gpu-context=wayland
#deband=yes

####################
# General Settings #
####################
#save-position-on-quit=yes # The last position of your video is saved when quitting mpv
force-seekable=yes # Force seeking (if seeking doesn't work)
#cache=yes
# cache-secs=300
# Uses extra large RAM cache (needs cache=yes to make it useful).
demuxer-max-bytes=1800M
demuxer-max-back-bytes=1200M

############
## UI ##
############
# Start in fullscreen by default
fullscreen=no
border=no # hide the window title bar
# No Autoplay
# pause=yes
#window-corners=round # For windows only
#fullscreen=yes # open video player in full screen
#keep-open=yes # Don't close the player after finishing the video
image-display-duration=5 # Play image for 5 seconds
drag-and-drop=auto # Other options no|replaace|append|insert-next
# on-top # Make the window stay on top of other windows
ontop=yes
snap-window=yes
title-bar=yes
cursor-autohide=1000 # cursor hide in ms
# cursor-autohide-fs-only # cursor shown in windowed mode but not in fullscreen mode
auto-window-resize=yes
#geometry=50%:50%
window-dragging = yes
# Resize window if it's larger or smaller
autofit-larger=100%x80%
autofit-smaller=65%x65%

########
# OSD ###
osc = yes # load on-screen controller
msg-color=yes # color log messages on terminal
term-osd-bar=yes # display a progress bar on the terminal
term-osd-bar-chars = "──╼ ·" # custom terminal seek bar
osd-duration=500 # Hide OSD text after x ms.
osd-font='Ubuntu Nerd Font'
osd-font-size=24
osd-spacing=0.5
osd-bold=yes # Format text on bold
osd-italic=yes # Format text on italic
osd-bar=no
osd-on-seek=bar # Other options no, msg, msg-bar
osd-playlist-entry=filename # Other options title or both
#background-color='#24273a'
#osd-back-color='#6e738d'
#osd-border-color='#181926c
#osd-color='#cad3f5'
#osd-shadow-color='#24273a'
osd-level=1

#####################
# Language Priority #
#####################
alang=en,eng,ja,jp,jpn # Audio language priority
slang=en,eng # Subtitle language priority

#########
# Cache #
#########
cache=auto # Use network cache settings

############
# Subtitle #
############
#blend-subtitles=yes
# sub-font='Gandhi Sans'
# sub-font='Karla Medium'
# sub-font='Iosevka Aile Medium'
# sub-font='Atkinson Hyperlegible Next Medium'
# sub-font='IBM Plex Sans'
sub-font='Helvetica Neue'
sub-bold=yes # Set the font to bold.
#sub-italic=yes
sub-font-size=48 # Set default subtitle size if not specified.
sub-blur=0.1

sub-back-color='#2E3440'
sub-border-color='#2E3440'
sub-shadow-color='#2E3440'
sub-outline-color='#2E3440'

sub-border-size=3
sub-color="#ECEFF4"


# "Adjust subtitle timing is to remove minor gaps or overlaps
# between subtitles (if the difference is smaller than 210
# ms, the gap or overlap is removed)."
sub-fix-timing=yes
sub-margin-x=100
sub-margin-y=45
sub-scale=0.8
#sub-shadow-color=0.0/0.0/0.0
sub-border-size=2.4
sub-border-color="#FF000000"
sub-border-style=outline-and-shadow
sub-shadow-color="#A0000000"
sub-shadow-offset=0.8
sub-ass-style-overrides=Kerning=yes
#sub-shadow-offset=2
#sub-spacing=0.5
sub-ass-override=no # Toggle with k
# Paths to Subtitles
sub-auto=fuzzy # external subs don't have to match the file name exactly to autoload
# Search all subdirectories for subtitles
sub-file-paths=**
sub-file-paths-append='Subs/${filename/no-ext}'      # search for external subs in these relative subdirectories
sub-file-paths-append='Subs/${filename}'
sub-file-paths-append='subs/${filename/no-ext}'
sub-file-paths-append='subs/${filename}'
sub-file-paths-append=ass # search for external subs in these relative subdirectories
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=Subs
sub-file-paths-append=subtitles
#sub-ass=no # change embedded subtitle font
demuxer-mkv-subtitle-preroll=yes       		# try to correctly show embedded subs when seeking
embeddedfonts=yes # use embedded fonts for SSA/ASS subs
#sub-ass-force-style=Kerning=yes # allows you to override style parameters of ASS scripts
sub-use-margins
sub-ass-force-margins
sub-scale-with-window=yes
#sub-scale-by-windows=yes
## Settings for image-based subtitle files (PGS, SUP)
sub-gray
# "Apply Gaussian blur to image subtitles (default: 0). This can help to make
# pixelated DVD/Vobsubs look nicer. A value other than 0 also switches to
# software subtitle scaling. Might be slow."
sub-gauss=0.05
sub-justify=auto
sub-font-provider=auto
#######################
# Video Configuration #
#######################
# vo=gpu-next # video output driver
#vo=gpu # video output driver
# vo=wlshm
#######################
# Audio Configuration #
#######################
volume=70 # default volume of the player
volume-max=200 # max volume of the player

############################
# Screenshot Configuration #
############################
#Turns on software rendering for screenshots
#Faster, but might lack stuff like HDR
screenshot-sw=yes
#Output format of screenshots
screenshot-format=png
#Same output bitdepth as the video
#Set it "no" if you want to save disc space
screenshot-high-bit-depth=yes
#Compression of the PNG picture (1-9)
#Higher value means better compression, but takes more time
screenshot-png-compression=3 # Setting too high may lag the PC on weaker systems. Recommend 3 (weak systems) or 7.
#Quality of JPG pictures (0-100)
#Higher value means better quality
screenshot-jpeg-quality=95
#Output directory
screenshot-directory="~/Pictures/mpv/"
#Name format you want to save the pictures
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"


# Playback
# Global reset of deinterlacing to off
deinterlace=no

# Colorspace
# Specifies the primaries of the  display.  Video  colors  will  be
target-prim=auto
target-trc=auto
# Setup a chain of video filters.
# vf=format=colorlevels=full:colormatrix=auto
# video-output-levels=full

############################
#### Miscellaneous #########
############################

# YT-DL
ytdl-format=bestvideo[height<=?1080][fps<=?30][vcodec!=?vp9][protocol!=http_dash_segments]+bestaudio/best[height<=720][fps<=?30]
ytdl-raw-options=sub-lang="en"
